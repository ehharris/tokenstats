[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenstats"
version = "1.0.0"
description = "Permanent local record of OpenCode AI token usage."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tokenstats = "tokenstats:cli_main"

[tool.setuptools]
py-modules = ["tokenstats"]
