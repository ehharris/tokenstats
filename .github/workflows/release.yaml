name: Release to PyPI

# Trusted publishing: on a version tag, build sdist + wheel and upload to PyPI
# via OIDC — no stored API token. The PyPI publisher must be configured for
# this repo, this workflow file, and the "pypi" environment below.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Tests (strict: no ResourceWarnings)"
        run: python -W error::ResourceWarning -m unittest test_tokenstats

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match pyproject version
        run: |
          V=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          T="${GITHUB_REF_NAME#v}"
          [ "$T" = "$V" ] || { echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${V}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
